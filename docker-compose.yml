services:
  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    container_name: sporty-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  rocketmq-nameserver:
    image: apache/rocketmq:5.4.0
    hostname: rocketmq-nameserver
    container_name: sporty-rocketmq-nameserver
    command: sh mqnamesrv
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: apache/rocketmq:5.4.0
    hostname: rocketmq-broker
    container_name: sporty-rocketmq-broker
    depends_on:
      - rocketmq-nameserver
    command: sh mqbroker -n rocketmq-nameserver:9876 autoCreateTopicEnable=true
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"

  event-outcome-service:
    build:
      context: ./event-outcome-service
    container_name: sporty-event-outcome-service
    depends_on:
      - kafka
    environment:
      SERVER_PORT: 8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "8081:8081"

  bet-matching-service:
    build:
      context: ./bet-matching-service
    container_name: sporty-bet-matching-service
    depends_on:
      - kafka
      - rocketmq-nameserver
      - rocketmq-broker
    environment:
      SERVER_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ROCKETMQ_NAME_SERVER: rocketmq-nameserver:9876
    ports:
      - "8082:8082"

  bet-settlement-service:
    build:
      context: ./bet-settlement-service
    container_name: sporty-bet-settlement-service
    depends_on:
      - rocketmq-nameserver
      - rocketmq-broker
    environment:
      SERVER_PORT: 8083
      ROCKETMQ_NAME_SERVER: rocketmq-nameserver:9876
    ports:
      - "8083:8083"
